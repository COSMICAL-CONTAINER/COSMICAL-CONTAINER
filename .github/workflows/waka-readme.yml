name: update WakaTime metrics

on:
  schedule:
    # Run once a day at 00:30 China Standard Time (16:30 UTC).
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with WakaTime metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update WakaTime metrics
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          # Show aggregate time only. Do not publish languages or project details.
          SHOW_LANGUAGE: "False"
          SHOW_LANGUAGE_PER_REPO: "False"
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_AI_CODE_TIME: "True"
          SHOW_AI_CODING: "False"
          SHOW_LINES_OF_CODE: "False"
          SHOW_UPDATED_DATE: "False"

          # Keep the profile README focused on coding metrics.
          SHOW_OS: "False"
          SHOW_PROJECTS: "False"
          SHOW_EDITORS: "False"
          SHOW_TIMEZONE: "False"
          SHOW_COMMIT: "False"
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_SHORT_INFO: "False"
          SHOW_LOC_CHART: "False"

          BAR_STYLE: "text"
          SYMBOL_VERSION: "1"
